spring:
  application:
    name: optical-ai-lab
  datasource:
    url: jdbc:h2:file:./data/opticai
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:not-set}
      chat:
        options:
          model: claude-sonnet-4-6
          max-tokens: 8000
    openai:
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: gpt-4o-mini

youtube:
  api-key: ${YOUTUBE_API_KEY:not-set}

server:
  port: 8080
